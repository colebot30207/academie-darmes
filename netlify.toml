[build]
  publish = "."

# www -> apex (canonical is https://academiedarmes.com/)
[[redirects]]
  from = "https://www.academiedarmes.com/*"
  to = "https://academiedarmes.com/:splat"
  status = 301
  force = true

# Missing documents: serve a tiny placeholder (200) instead of a 404, so the
# "Coming soon" check doesn't log console errors. Real files always win over this rule.
[[redirects]]
  from = "/assets/docs/*"
  to = "/assets/docs-missing.txt"
  status = 200

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Documents get swapped in place, so keep them fresh.
[[headers]]
  for = "/assets/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
